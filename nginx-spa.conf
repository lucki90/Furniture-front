server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompresja gzip — mniejsze transfery dla JS/CSS
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache dla assetów z hashem w nazwie (angular generuje hash automatycznie)
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular SPA routing — fallback do index.html dla nieznanych tras
    location / {
        try_files $uri $uri/ /index.html;
    }
}
