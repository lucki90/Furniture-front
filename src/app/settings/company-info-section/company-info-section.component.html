<div class="company-info-content">

  <!-- Logo firmy -->
  <div class="logo-field">
    <div class="logo-field-label">
      Logo firmy
      <span class="logo-field-hint">· PNG / JPEG · max 500 KB</span>
    </div>

    <!-- Stan: brak logo -->
    <div *ngIf="!companyLogoUrl" class="logo-dropzone">
      <span class="logo-dropzone-icon">🖼️</span>
      <span class="logo-dropzone-text">Nie ustawiono logo</span>
      <label [class.disabled]="logoUploading" class="btn btn-sm logo-upload-btn">
        <span *ngIf="logoUploading" class="spinner spinner-sm logo-spinner"></span>
        {{ logoUploading ? 'Przesyłanie…' : 'Wybierz plik' }}
        <input (change)="onLogoSelected($event)" [disabled]="logoUploading"
               accept="image/png,image/jpeg"
               class="settings-hidden-file-input"
               type="file"/>
      </label>
    </div>

    <!-- Stan: logo ustawione -->
    <div *ngIf="companyLogoUrl" class="logo-filled">
      <div class="logo-img-wrap">
        <img [src]="companyLogoUrl" alt="Logo firmy" class="logo-img"/>
      </div>
      <div class="logo-filled-actions">
        <label [class.disabled]="logoUploading" class="btn btn-sm btn-outline">
          <span *ngIf="logoUploading" class="spinner spinner-sm logo-spinner"></span>
          {{ logoUploading ? 'Przesyłanie…' : 'Zmień' }}
          <input (change)="onLogoSelected($event)" [disabled]="logoUploading"
                 accept="image/png,image/jpeg"
                 class="settings-hidden-file-input"
                 type="file"/>
        </label>
        <button (click)="removeLogo()"
                [disabled]="logoUploading" class="btn btn-sm btn-outline-danger">
          Usuń
        </button>
      </div>
    </div>

    <p *ngIf="logoError" class="logo-error">{{ logoError }}</p>
  </div>

  <div class="form-grid">
    <app-form-field hint="Wyświetlana w nagłówku oferty (max 255 znaków)" label="Nazwa firmy">
      <input [(ngModel)]="companyName" class="form-control" maxlength="255"
             placeholder="np. Studio Mebli XYZ" type="text"/>
    </app-form-field>

    <app-form-field hint="Adres firmy (max 500 znaków)" label="Adres">
      <input [(ngModel)]="companyAddress" class="form-control" maxlength="500"
             placeholder="np. ul. Stolarska 5, 00-001 Warszawa" type="text"/>
    </app-form-field>

    <app-form-field hint="Numer telefonu firmy (max 50 znaków)" label="Telefon">
      <input [(ngModel)]="companyPhone" class="form-control" maxlength="50"
             placeholder="np. +48 600 100 200" type="text"/>
    </app-form-field>

    <app-form-field hint="Adres e-mail firmy (max 255 znaków)" label="E-mail">
      <input [(ngModel)]="companyEmail" class="form-control" maxlength="255"
             placeholder="np. kontakt@meble.pl" type="email"/>
    </app-form-field>

    <app-form-field hint="Liczba dni ważności oferty PDF (1–365)" label="Ważność oferty" unit="dni">
      <input [(ngModel)]="offerValidityDays" class="form-control" max="365"
             min="1" step="1" type="number"/>
    </app-form-field>
  </div>

</div>
