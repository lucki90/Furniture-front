<div class="auth-page-shell">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-title-group">
        <span class="auth-title-icon">
          <mat-icon aria-hidden="true">person_add</mat-icon>
        </span>
        <div>
          <h1 class="auth-title">Rejestracja</h1>
          <p class="auth-subtitle">Utworz konto, aby zapisywac projekty i korzystac z narzedzi aplikacji.</p>
        </div>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Imie</label>
          <input
            id="firstName"
            type="text"
            [(ngModel)]="firstName"
            name="firstName"
            class="form-control"
            placeholder="Jan"
            [disabled]="isLoading" />
        </div>

        <div class="form-group">
          <label for="lastName">Nazwisko</label>
          <input
            id="lastName"
            type="text"
            [(ngModel)]="lastName"
            name="lastName"
            class="form-control"
            placeholder="Kowalski"
            [disabled]="isLoading" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          class="form-control"
          placeholder="twoj@email.com"
          autocomplete="email"
          required
          [disabled]="isLoading" />
      </div>

      <div class="form-group">
        <label for="password">Haslo * <span class="hint">(min. 8 znakow)</span></label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          class="form-control"
          placeholder="Wprowadz haslo"
          autocomplete="new-password"
          required
          [disabled]="isLoading" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Powtorz haslo *</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          class="form-control"
          placeholder="Powtorz haslo"
          autocomplete="new-password"
          required
          [disabled]="isLoading" />
      </div>

      <div *ngIf="errorMessage" class="auth-error">
        <mat-icon aria-hidden="true">warning_amber</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner spinner-sm"></span>
        <ng-container *ngIf="!isLoading">
          <mat-icon class="workflow-action-icon" aria-hidden="true">person_add</mat-icon>
        </ng-container>
        {{ isLoading ? 'Rejestracja...' : 'Zarejestruj sie' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Masz juz konto? <a routerLink="/login">Zaloguj sie</a></p>
    </div>
  </div>
</div>
