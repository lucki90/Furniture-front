<div *ngIf="authService.isLoggedIn(); else authPages" class="app-shell">
  <nav class="topnav">
    <a class="topnav-brand" routerLink="/kitchen/projects">
      <span class="topnav-logo">
        <img alt="Furnitio" src="assets/furnitio-logo-tight.png"/>
      </span>
    </a>

    <div class="topnav-links">
      <a class="topnav-link" routerLink="/alone-cabinet" routerLinkActive="active" title="Pojedyncza szafka">
        <mat-icon aria-hidden="true" class="topnav-link-icon">inventory_2</mat-icon>
        <span class="topnav-link-text">Pojedyncza szafka</span>
      </a>
      <a class="topnav-link" routerLink="/kitchen/projects" routerLinkActive="active" title="Projekty">
        <mat-icon aria-hidden="true" class="topnav-link-icon">folder</mat-icon>
        <span class="topnav-link-text">Projekty</span>
      </a>
      <a [routerLinkActiveOptions]="{exact: true}" class="topnav-link" routerLink="/kitchen" routerLinkActive="active"
         title="Nowy projekt">
        <mat-icon aria-hidden="true" class="topnav-link-icon">kitchen</mat-icon>
        <span class="topnav-link-text">Nowy projekt</span>
      </a>
      <a *ngIf="authService.isAdmin()" class="topnav-link" routerLink="/admin/materials" routerLinkActive="active"
         title="Zarzadzanie materialami">
        <mat-icon aria-hidden="true" class="topnav-link-icon">inventory</mat-icon>
        <span class="topnav-link-text">Materialy</span>
      </a>
      <a class="topnav-link" routerLink="/settings" routerLinkActive="active" title="Ustawienia">
        <mat-icon aria-hidden="true" class="topnav-link-icon">settings</mat-icon>
        <span class="topnav-link-text">Ustawienia</span>
      </a>
    </div>

    <div class="topnav-right">
      <select
        (change)="onLanguageChange($event)"
        [value]="languageService.lang()"
        class="topnav-lang"
        title="Jezyk / Language">
        <option *ngFor="let l of languageService.supportedLanguages; trackBy: trackByCode" [value]="l.code">{{ l.label
          }}
        </option>
      </select>

      <div class="topnav-user">
        <div class="topnav-avatar">{{ userInitials() }}</div>
        <div class="topnav-user-info">
          <span class="topnav-user-email">{{ authService.user()?.email }}</span>
          <span class="topnav-user-role">{{ authService.user()?.role }}</span>
        </div>
      </div>

      <button (click)="authService.logout()" class="topnav-logout" title="Wyloguj sie" type="button">
        Wyloguj
      </button>
    </div>
  </nav>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <app-toast-container></app-toast-container>
</div>

<ng-template #authPages>
  <router-outlet></router-outlet>
  <app-toast-container></app-toast-container>
</ng-template>
