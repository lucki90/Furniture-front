@if (visible) {
<div [id]="id" class="dropdown-container">
  @if (label) {
  <label [for]="id + '-select'" class="dropdown-label">{{ label }}</label>
  }

  <select
    (blur)="markAsTouched()"
    (change)="onSelectionChange($event)"
    [class.error]="hasError"
    [disabled]="disabled"
    [id]="id + '-select'"
    class="dropdown-select form-control"
  >
    @for (option of options; track option.value; let i = $index) {
    <option [selected]="isSelected(option.value)" [value]="i">
      {{ translations[option.label] || option.label }}
    </option>
    }
  </select>

  @if (hasError) {
  <p class="dropdown-error">{{ displayedErrorMessage }}</p>
  }
</div>
}
