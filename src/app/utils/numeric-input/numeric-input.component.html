<div [id]="id" class="numeric-input-container">
  <div class="numeric-input-header">
    <label *ngIf="label" [for]="id + '-input'" class="numeric-input-label">
      {{ label }}
    </label>
    <span class="numeric-input-value">{{ value !== null && value !== undefined ? value : '-' }}</span>
  </div>

  <input
    (input)="onInputChange($event)"
    [appMaxLengthForNumber]="10"
    [class.error]="hasError"
    [disabled]="_isDisabled"
    [id]="id + '-input'"
    [maxDecimalPlaces]="2"
    [max]="max"
    [min]="min"
    [step]="step"
    [value]="value"
    class="numeric-input-field"
    type="number"
  />

  <div class="range-container">
    <span class="range-label">{{ min }}</span>
    <input
      (input)="onInputChange($event)"
      [disabled]="_isDisabled"
      [id]="id + '-range'"
      [max]="max"
      [min]="min"
      [step]="step"
      [value]="value"
      class="numeric-input-range"
      type="range"
    />
    <span class="range-label">{{ max }}</span>
  </div>

  <p *ngIf="hasError" class="numeric-input-error">
    {{ displayedErrorMessage }}
  </p>
</div>
