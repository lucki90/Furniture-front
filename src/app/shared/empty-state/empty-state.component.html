<div [class.empty-state--compact]="compact" class="empty-state">
  <div *ngIf="icon" aria-hidden="true" class="empty-state__icon">{{ icon }}</div>
  <h2 *ngIf="title" class="empty-state__title">{{ title }}</h2>
  <p *ngIf="message" class="empty-state__message">{{ message }}</p>
  <div *ngIf="!compact || icon || title || message" class="empty-state__actions">
    <ng-content></ng-content>
  </div>
</div>
