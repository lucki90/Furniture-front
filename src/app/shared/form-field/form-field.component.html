<div class="form-field">
  <label *ngIf="label" class="form-field__label">{{ label }}</label>
  <div [class.form-field__input-wrapper--with-unit]="unit" class="form-field__input-wrapper">
    <ng-content></ng-content>
    <span *ngIf="unit" class="form-field__unit">{{ unit }}</span>
  </div>
  <div *ngIf="errorMessage" class="form-field__error">{{ errorMessage }}</div>
  <div *ngIf="hint && !errorMessage" class="form-field__hint">{{ hint }}</div>
</div>
