<section class="not-found" aria-labelledby="not-found-title">
  <div class="not-found__card">
    <p class="not-found__code" aria-label="Błąd 404">404</p>
    <h1 id="not-found-title">Nie znaleziono strony</h1>
    <p class="not-found__message">
      Podany adres jest nieprawidłowy albo strona została przeniesiona.
    </p>
    <a class="not-found__action" [routerLink]="primaryAction().link">
      {{ primaryAction().label }}
    </a>
  </div>
</section>
