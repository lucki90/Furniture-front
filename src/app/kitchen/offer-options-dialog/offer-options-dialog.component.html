<h2 mat-dialog-title>Generuj ofertę PDF</h2>

<mat-dialog-content>

  <div class="option-row checkbox-row">
    <label class="checkbox-label">
      <input [(ngModel)]="showCostDetails" type="checkbox"/>
      <span>Pokaż szczegóły kosztów (materiały, montaż, narzuty)</span>
    </label>
    <p class="hint">
      Jeśli odznaczone, PDF pokaże tylko rabat (jeśli dotyczy) i cenę końcową.
    </p>
  </div>

  <div class="section-divider"></div>

  <p class="section-label">Skrócony opis projektu (opcjonalnie)</p>

  <div class="option-row">
    <label class="form-label" for="frontDesc">Fronty</label>
    <input [(ngModel)]="frontDescription" class="form-input" id="frontDesc"
           placeholder="np. Lakierowane matowe MDF"
           type="text"/>
  </div>

  <div class="option-row">
    <label class="form-label" for="countertopDesc">Blat</label>
    <input [(ngModel)]="countertopDescription" class="form-input" id="countertopDesc"
           placeholder="np. 38mm Dąb laminowany"
           type="text"/>
  </div>

  <div class="option-row">
    <label class="form-label" for="hardwareDesc">Okucia</label>
    <input [(ngModel)]="hardwareDescription" class="form-input" id="hardwareDesc"
           placeholder="np. Blum"
           type="text"/>
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button (click)="onCancel()" class="btn-cancel">Anuluj</button>
  <button (click)="onGenerate()" class="btn-generate">Generuj PDF</button>
</mat-dialog-actions>
