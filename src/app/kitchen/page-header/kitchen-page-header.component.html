<header class="page-header app-page-header">
  <div class="page-title app-page-title-group">
    <mat-icon class="page-title-icon app-page-title-icon" aria-hidden="true">kitchen</mat-icon>

    <div class="page-title-copy">
      <h1 class="project-name app-page-title">{{ projectDisplayName }}</h1>

      <div class="page-title-subline" *ngIf="projectId; else newProjectMeta">
        <span class="page-title-meta">
          <span class="meta-item">#{{ projectId }}</span>
          <span class="meta-sep" aria-hidden="true">|</span>
          <span class="meta-item">v{{ projectVersion }}</span>
        </span>

        <span
          class="status-badge-inline"
          *ngIf="hasProjectId"
          [style.background-color]="projectStatusColor + '18'"
          [style.color]="projectStatusColor"
          [style.border-color]="projectStatusColor + '40'">
          {{ projectStatusLabel }}
        </span>

        <select
          *ngIf="hasProjectId && allowedTransitions.length > 0"
          class="status-select"
          [disabled]="isChangingStatus"
          (change)="onStatusSelect($event)"
          [style.border-color]="projectStatusColor + '60'">
          <option value="" disabled selected>{{ isChangingStatus ? 'Zmieniam...' : 'Zmien status...' }}</option>
          <option *ngFor="let status of allowedTransitions; trackBy: trackByStatus" [value]="status.value">
            {{ status.label }}
          </option>
        </select>
      </div>

      <ng-template #newProjectMeta>
        <p class="page-title-subtitle app-page-subtitle">{{ projectSubtitle }}</p>
      </ng-template>
    </div>
  </div>

  <div class="page-actions app-page-header-actions">
    <div class="view-toggle" role="tablist" aria-label="Tryb widoku">
      <button
        type="button"
        role="tab"
        class="view-toggle-btn"
        [class.active]="view === 'config'"
        [attr.aria-selected]="view === 'config'"
        [disabled]="isEditingCabinet"
        [title]="isEditingCabinet ? 'Zakoncz edycje szafki, aby zmienic widok' : ''"
        (click)="setView('config')">
        <mat-icon class="view-toggle-icon" aria-hidden="true">tune</mat-icon>
        Konfigurator
      </button>
      <button
        type="button"
        role="tab"
        class="view-toggle-btn"
        [class.active]="view === 'costs'"
        [attr.aria-selected]="view === 'costs'"
        [disabled]="totalCabinetCount === 0 || isEditingCabinet"
        [title]="isEditingCabinet ? 'Zakoncz edycje szafki, aby przejsc do kosztow' : (totalCabinetCount === 0 ? 'Dodaj szafki, aby zobaczyc koszty' : '')"
        (click)="setView('costs')">
        <mat-icon class="view-toggle-icon" aria-hidden="true">receipt_long</mat-icon>
        Koszty
        <span class="view-toggle-dot" *ngIf="hasCalculationResult && view !== 'costs'" aria-label="Wyniki kalkulacji"></span>
      </button>
    </div>

    <div class="actions-divider" aria-hidden="true"></div>

    <div class="page-actions-secondary">
      <button
        type="button"
        class="btn btn-outline projects-toggle-btn"
        [class.projects-toggle-btn--active]="isProjectsDrawerOpen"
        [attr.aria-expanded]="isProjectsDrawerOpen"
        aria-controls="projects-drawer"
        (click)="toggleProjectsDrawer.emit()">
        <mat-icon class="btn-icon-text" aria-hidden="true">chevron_left</mat-icon>
        Projekty
      </button>
      <button
        class="btn btn-icon-only"
        type="button"
        title="Cofnij (Ctrl+Z)"
        aria-label="Cofnij"
        [disabled]="!canUndo"
        (click)="undoAction.emit()">
        <mat-icon aria-hidden="true">undo</mat-icon>
      </button>
      <button
        class="btn btn-icon-only"
        type="button"
        title="Ponow (Ctrl+Y)"
        aria-label="Ponow"
        [disabled]="!canRedo"
        (click)="redoAction.emit()">
        <mat-icon aria-hidden="true">redo</mat-icon>
      </button>
    </div>

    <div class="page-actions-aux"></div>

    <div class="workflow-actions page-actions-workflow">
      <button
        class="btn workflow-action-btn workflow-action-btn--clear"
        type="button"
        (click)="clearAll.emit()"
        [disabled]="totalCabinetCount === 0 || isEditingCabinet"
        title="Wyczysc projekt">
        <mat-icon class="workflow-action-icon" aria-hidden="true">delete</mat-icon>
        Wyczysc
      </button>
      <button
        class="btn workflow-action-btn workflow-action-btn--calculate"
        type="button"
        (click)="calculateProject.emit()"
        [disabled]="totalCabinetCount === 0 || isCalculatingProject || isEditingCabinet">
        <mat-icon class="workflow-action-icon" aria-hidden="true">functions</mat-icon>
        {{ isCalculatingProject ? 'Wyliczam...' : 'Wylicz' }}
      </button>
      <button
        class="btn workflow-action-btn workflow-action-btn--save"
        type="button"
        (click)="saveProject.emit()"
        [disabled]="totalCabinetCount === 0 || isSavingProject || isEditingCabinet">
        <mat-icon class="workflow-action-icon" aria-hidden="true">save</mat-icon>
        {{ isSavingProject ? 'Zapisuje...' : 'Zapisz' }}
      </button>
    </div>
  </div>
</header>
