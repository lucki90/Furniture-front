<!-- Podgląd SVG szafki narożnej — zakładka "Opcje" (Iteracja 3 poprawka 2026-05-24) -->
<div [formGroup]="form" class="corner-preview-container">
  <span class="preview-label">Podgląd schematyczny</span>

  <svg aria-label="Podgląd szafki narożnej" class="corner-svg" viewBox="0 0 200 200">
    <!-- Type A: Kształt L -->
    <ng-container *ngIf="!isCornerTypeB">
      <polygon
        [attr.points]="'10,10 ' + (10 + 80) + ',10 ' + (10 + 80) + ',' + (10 + 40) + ' ' + (10 + 40) + ',' + (10 + 40) + ' ' + (10 + 40) + ',' + (10 + 80) + ' 10,' + (10 + 80)"
        fill="#e8d4a8" stroke="#8B4513" stroke-width="2"/>
      <text font-size="10" text-anchor="middle" x="50" y="8">A: {{ form.get('cornerWidthA')?.value }}mm</text>
      <text font-size="10" text-anchor="middle" transform="rotate(-90, 5, 55)" x="5" y="55">B: {{
        form.get('cornerWidthB')?.value }}mm
      </text>
    </ng-container>
    <!-- Type B: Prostokąt z frontem uchylnym -->
    <ng-container *ngIf="isCornerTypeB">
      <rect fill="#d4e8d4" height="80" stroke="#2e7d32" stroke-width="2" width="100" x="10" y="10"/>
      <rect [attr.width]="(form.get('cornerFrontUchylnyWidthMm')?.value || 500) / 12" fill="#a5d6a7" height="80" stroke="#2e7d32"
            stroke-width="2" x="10" y="10"/>
      <text font-size="10" text-anchor="middle" x="60" y="8">A: {{ form.get('cornerWidthA')?.value }}mm</text>
      <text font-size="9" text-anchor="middle" transform="rotate(-90, 8, 55)" x="8" y="55">front: {{
        form.get('cornerFrontUchylnyWidthMm')?.value }}mm
      </text>
      <text fill="#555" font-size="8" text-anchor="middle" x="60" y="55">Ślepy narożnik</text>
    </ng-container>
    <text fill="currentColor" font-size="18" font-weight="700" text-anchor="middle" x="100" y="140">
      {{ currentCornerMechanism === 'MAGIC_CORNER_COMFORT' ? 'MCc' :
      currentCornerMechanism === 'MAGIC_CORNER_STANDARD' ? 'MCs' :
      currentCornerMechanism === 'CAROUSEL_270' ? 'C270' :
      currentCornerMechanism === 'CAROUSEL_360' ? 'C360' :
      currentCornerMechanism === 'LE_MANS_I' ? 'LM I' :
      currentCornerMechanism === 'LE_MANS_II' ? 'LM II' :
      currentCornerMechanism === 'FIXED_SHELVES' ? 'FS' :
      currentCornerMechanism === 'BLIND_CORNER' ? 'BC' : 'BOX' }}
    </text>
    <text font-size="10" text-anchor="middle" x="100" y="160">{{ currentCornerMechanismLabel }}</text>
  </svg>

  <p class="preview-note">
    ⚠ Pełna wizualizacja (top-view, elevation, kierunek otwarcia drzwi) zaplanowana w Iteracji 6
    (VIZ-CORNER-TOP, VIZ-CORNER-FRONT).
  </p>
</div>
