<div [formGroup]="form" class="enclosure-section">
  <app-cabinet-section-header title="Obudowa boczna"></app-cabinet-section-header>

  <div class="enclosure-row">

    <!-- Strona lewa -->
    <div class="enclosure-side">
      <span class="enclosure-side-label">Lewa strona</span>
      <div class="form-group">
        <label class="form-label">Typ obudowy</label>
        <select class="form-control" formControlName="leftEnclosureType">
          <option *ngFor="let opt of enclosureOptions; trackBy: trackByValue" [value]="opt.value">{{ opt.label }}
          </option>
        </select>
      </div>
      <div *ngIf="isLeftParallelFiller" class="form-group enclosure-support-group">
        <label class="form-label enclosure-checkbox-label">
          <input class="enclosure-checkbox" formControlName="leftSupportPlate" type="checkbox"/>
          Podpora blendy
        </label>
      </div>
      <app-form-field *ngIf="isLeftParallelFiller" class="form-group enclosure-distance-group"
                      label="Szerokość blendy (override)" unit="mm">
        <input [placeholder]="'domyślnie ' + stateService.fillerWidthMm()" class="form-control form-control-sm" formControlName="leftFillerWidthOverrideMm"
               id="leftFillerW"
               max="200"
               min="20" step="5" type="number"/>
      </app-form-field>
    </div>

    <!-- Strona prawa -->
    <div class="enclosure-side">
      <span class="enclosure-side-label">Prawa strona</span>
      <div class="form-group">
        <label class="form-label">Typ obudowy</label>
        <select class="form-control" formControlName="rightEnclosureType">
          <option *ngFor="let opt of enclosureOptions; trackBy: trackByValue" [value]="opt.value">{{ opt.label }}
          </option>
        </select>
      </div>
      <div *ngIf="isRightParallelFiller" class="form-group enclosure-support-group">
        <label class="form-label enclosure-checkbox-label">
          <input class="enclosure-checkbox" formControlName="rightSupportPlate" type="checkbox"/>
          Podpora blendy
        </label>
      </div>
      <app-form-field *ngIf="isRightParallelFiller" class="form-group enclosure-distance-group"
                      label="Szerokość blendy (override)" unit="mm">
        <input [placeholder]="'domyślnie ' + stateService.fillerWidthMm()" class="form-control form-control-sm" formControlName="rightFillerWidthOverrideMm"
               id="rightFillerW"
               max="200"
               min="20" step="5" type="number"/>
      </app-form-field>
    </div>

  </div>

  <!-- Głębokość zabudowy (override) -->
  <app-form-field class="form-group enclosure-distance-group"
                  hint="Puste = wartość z ustawień globalnych ({{ stateService.distanceFromWallMm() }} mm)" label="Głębokość zabudowy (override)"
                  unit="mm">
    <input [placeholder]="'domyślnie ' + stateService.distanceFromWallMm()" class="form-control form-control-sm" formControlName="distanceFromWallMm"
           id="distanceFromWallMm"
           max="700"
           min="400" step="10" type="number"/>
  </app-form-field>
</div>
