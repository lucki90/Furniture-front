<div [formGroup]="form" class="sink-section">
  <app-cabinet-section-header title="Konfiguracja szafki pod płytę grzewczą"></app-cabinet-section-header>

  <!-- Typ płyty grzewczej -->
  <div class="form-row">
    <div class="form-group flex-2">
      <label class="form-label">Typ płyty grzewczej</label>
      <select class="form-control" formControlName="cooktopType">
        <option *ngFor="let o of dictionaryService.data().cooktopTypes; trackBy: trackByCode" [value]="o.code">{{
          o.label }}
        </option>
      </select>
      <span *ngIf="isGasCooktop" class="form-hint">
        <mat-icon aria-hidden="true" class="form-hint-icon">warning_amber</mat-icon>
        Wymagana wentylacja wg PN-83/B-03430 - brak tylnej scianki HDF w BOM
      </span>
    </div>
  </div>

  <!-- Typ frontu -->
  <div class="form-row">
    <div class="form-group flex-2">
      <label class="form-label">Konfiguracja frontu</label>
      <select class="form-control" formControlName="cooktopFrontType">
        <option *ngFor="let o of dictionaryService.data().cooktopFrontTypes; trackBy: trackByCode" [value]="o.code">{{
          o.label }}
        </option>
      </select>
    </div>
  </div>

  <!-- Szuflady — widoczne gdy DRAWERS -->
  <div *ngIf="showDrawerOptions" class="form-row">
    <div class="form-group flex-1">
      <label class="form-label">Ilość szuflad</label>
      <input class="form-control" formControlName="drawerQuantity" max="3"
             min="2" step="1" type="number">
      <span class="form-hint">2 lub 3 szuflady</span>
    </div>
    <div class="form-group flex-2">
      <label class="form-label">System szuflad</label>
      <select class="form-control" formControlName="drawerModel">
        <option *ngFor="let o of dictionaryService.data().drawerModels; trackBy: trackByCode" [value]="o.code">{{
          o.label }}
        </option>
      </select>
    </div>
  </div>
</div>
