<div [formGroup]="form" class="sink-section">
  <app-cabinet-section-header title="Konfiguracja szafki na okap"></app-cabinet-section-header>

  <!-- Typ frontu okapu -->
  <div class="form-row">
    <div class="form-group flex-2">
      <label class="form-label">Typ frontu</label>
      <select class="form-control" formControlName="hoodFrontType">
        <option *ngFor="let o of dictionaryService.data().hoodFrontTypes; trackBy: trackByCode" [value]="o.code">{{
          o.label }}
        </option>
      </select>
    </div>
  </div>

  <!-- Blenda wewnętrzna maskująca okap -->
  <div class="form-row">
    <div class="form-group flex-2">
      <label class="form-label enclosure-checkbox-label">
        <input class="enclosure-checkbox" formControlName="hoodScreenEnabled" type="checkbox">
        Blenda wewnętrzna (maskuje mechanizm okapu)
      </label>
      <span class="form-hint">Panel poziomy w przedniej części szafki, zasłaniający sterowanie okapu</span>
    </div>
  </div>

  <!-- Wysokość blendy — widoczna gdy blenda włączona -->
  <div *ngIf="showHoodScreenHeight" class="form-row">
    <div class="form-group flex-1">
      <label class="form-label">Wysokość blendy wewnętrznej (mm)</label>
      <input class="form-control" formControlName="hoodScreenHeightMm" max="200"
             min="50" step="10" type="number">
      <span class="form-hint">50–200mm (domyślnie 100mm)</span>
      <span *ngIf="form.get('hoodScreenHeightMm')?.errors?.['outOfRange']" class="form-error">
        Wysokość blendy musi mieścić się w zakresie 50–200mm
      </span>
    </div>
  </div>
</div>
