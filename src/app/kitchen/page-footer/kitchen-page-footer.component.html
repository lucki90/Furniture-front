<footer class="page-footer">
  <div class="footer-stats">
    <div class="footer-stat">
      <span class="footer-stat-label">Szafek</span>
      <span class="footer-stat-value">{{ totalCabinetCount }}</span>
    </div>
    <div class="footer-stat">
      <span class="footer-stat-label">Scian</span>
      <span class="footer-stat-value">{{ wallsCount }}</span>
    </div>
    <div *ngIf="projectResult" class="footer-stat">
      <span class="footer-stat-label">Lacznie</span>
      <span class="footer-stat-value footer-stat-value--accent">{{ adjustedTotalCost.toFixed(0) }} zł</span>
    </div>
  </div>

  <div class="footer-actions">
    <div class="footer-actions-aux">
      <ng-container *ngIf="projectResult">
        <button
          (click)="downloadExcel.emit()"
          [disabled]="isExporting"
          [title]="isExporting ? 'Generowanie pliku...' : 'Pobierz liste plyt do zamowienia (.xlsx)'"
          class="btn-footer btn-footer-secondary"
          type="button">
          <ng-container *ngIf="isExporting; else excelIcon">
            <mat-icon aria-hidden="true" class="btn-footer-icon btn-footer-icon--spinning">autorenew</mat-icon>
          </ng-container>
          <ng-template #excelIcon>
            <mat-icon aria-hidden="true" class="btn-footer-icon">table_chart</mat-icon>
          </ng-template>
          <span class="btn-footer-text">{{ isExporting ? 'Generowanie...' : 'Excel' }}</span>
        </button>
      </ng-container>
    </div>

    <div class="workflow-actions">
      <button
        (click)="clearAll.emit()"
        [disabled]="totalCabinetCount === 0 || editingCabinetId !== null"
        class="btn workflow-action-btn workflow-action-btn--clear"
        title="Wyczysc projekt"
        type="button">
        <mat-icon aria-hidden="true" class="workflow-action-icon">delete</mat-icon>
        Wyczysc
      </button>
      <button
        (click)="calculateProject.emit()"
        [disabled]="totalCabinetCount === 0 || isCalculatingProject || editingCabinetId !== null"
        class="btn workflow-action-btn workflow-action-btn--calculate"
        type="button">
        <mat-icon aria-hidden="true" class="workflow-action-icon">functions</mat-icon>
        <span class="btn-footer-text">{{ isCalculatingProject ? 'Wyliczam...' : 'Wylicz' }}</span>
      </button>
      <button
        (click)="saveProject.emit()"
        [disabled]="totalCabinetCount === 0 || isSavingProject || editingCabinetId !== null"
        class="btn workflow-action-btn workflow-action-btn--save"
        type="button">
        <mat-icon aria-hidden="true" class="workflow-action-icon">save</mat-icon>
        <span class="btn-footer-text">{{ isSavingProject ? 'Zapisuje...' : 'Zapisz' }}</span>
      </button>
    </div>
  </div>
</footer>
