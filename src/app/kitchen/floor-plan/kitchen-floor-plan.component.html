<div class="floor-plan-container">
  <svg class="floor-plan-svg" [attr.viewBox]="'0 0 ' + svgWidth + ' ' + svgHeight">
    <defs>
      <pattern id="grid-minor" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#e9eef5" stroke-width="0.55"/>
      </pattern>
      <pattern id="grid-major" width="64" height="64" patternUnits="userSpaceOnUse">
        <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#d6deea" stroke-width="0.85"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" class="floor-plan-bg"/>
    <rect
      [attr.x]="sceneInset"
      [attr.y]="sceneInset"
      [attr.width]="svgWidth - sceneInset * 2"
      [attr.height]="svgHeight - sceneInset * 2"
      class="floor-plan-stage"
      rx="7"/>
    <rect width="100%" height="100%" fill="url(#grid-minor)"/>
    <rect width="100%" height="100%" fill="url(#grid-major)"/>

    @for (pos of wallPositions(); track pos.wall.id) {
      <g
        appFloorPlanWallGroup
        [wallPosition]="pos"
        [cabinets]="getCabinetsForWall(pos)"
        [countertops]="getCountertopsForWall(pos)"
        [selected]="isSelected(pos.wall.id)"
        [canRemoveWall]="canRemoveWall()"
        [editingCabinetId]="editingCabinetId"
        [showCountertop]="showCountertop()"
        [showUpperCabinets]="showUpperCabinets()"
        (wallSelected)="onWallClick($event)"
        (wallRemoved)="onRemoveWall($event)">
      </g>
    }

    <g
      appFloorPlanOverlayLayer
      [showCountertop]="showCountertop()"
      [showDoorArcs]="showDoorArcs()"
      [cornerCountertops]="cornerCountertopPositions()"
      [doorArcs]="doorArcData()">
    </g>
  </svg>

  <div class="floor-plan-toolbar">
    <label class="fp-toggle">
      <input type="checkbox" [checked]="showDoorArcs()" (change)="showDoorArcs.set(!showDoorArcs())">
      🚪 Otwarcie drzwi
    </label>
  </div>
</div>
