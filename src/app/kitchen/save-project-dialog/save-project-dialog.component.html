<div class="dialog-container">
  <h2 class="dialog-title">{{ dialogTitle }}</h2>

  <div class="dialog-content">
    <div class="form-group">
      <label class="form-label" for="projectName">Nazwa projektu *</label>
      <input
        [(ngModel)]="projectName"
        autofocus
        class="form-control"
        id="projectName"
        placeholder="np. Kuchnia Kowalskich"
        type="text">
      <span *ngIf="!projectName.trim()" class="form-hint">Nazwa jest wymagana</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="projectDescription">Opis (opcjonalnie)</label>
      <textarea
        [(ngModel)]="projectDescription"
        class="form-control"
        id="projectDescription"
        placeholder="np. Biała kuchnia w kształcie L, fronty lakierowane"
        rows="3">
      </textarea>
    </div>

    <hr class="section-divider">
    <p class="section-label">Dane klienta (opcjonalne — używane w ofercie PDF)</p>

    <div class="form-group">
      <label class="form-label" for="clientName">Imię / nazwa klienta</label>
      <input
        [(ngModel)]="clientName"
        class="form-control"
        id="clientName"
        placeholder="np. Jan Kowalski"
        type="text">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="clientPhone">Telefon</label>
        <input
          [(ngModel)]="clientPhone"
          class="form-control"
          id="clientPhone"
          placeholder="np. +48 600 100 200"
          type="tel">
      </div>
      <div class="form-group">
        <label class="form-label" for="clientEmail">E-mail</label>
        <input
          [(ngModel)]="clientEmail"
          class="form-control"
          id="clientEmail"
          placeholder="np. jan.kowalski@email.pl"
          type="email">
      </div>
    </div>
  </div>

  <div class="dialog-actions">
    <button (click)="onCancel()" class="btn btn-secondary">Anuluj</button>
    <button (click)="onSave()" [disabled]="!isValid" class="btn btn-primary">
      {{ submitLabel }}
    </button>
  </div>
</div>
